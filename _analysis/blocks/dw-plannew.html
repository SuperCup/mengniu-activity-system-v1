<div class="drawer" id="dw-plannew" style="width:820px">
  <div class="dw-h">
    <h3 id="pnTitle">创建活动计划 <span class="sub">项目：双节常温奶满减 · MN-WX-202612-0041</span></h3>
    <span class="dw-x" onclick="closeDrawer()">×</span>
  </div>
  <div class="dw-b">

    <!-- 一、计划基础信息 -->
    <div class="psec"><h4>一、计划基础信息</h4></div>
    <div class="fr">
      <label>计划名称<em>*</em></label><input class="inp" id="pnName" placeholder="如：双节满减主推">
    </div>
    <div class="fr"><label>活动机制<em>*</em></label><input class="inp" id="pnMech" placeholder="如：常温奶满 99 减 15"></div>
    <div class="fg c2">
      <div class="fr"><label>开始时间<em>*</em></label><input class="inp" id="pnStart" type="date" value="2026-12-20"></div>
      <div class="fr"><label>结束时间<em>*</em></label><input class="inp" id="pnEnd" type="date" value="2027-01-05"></div>
    </div>

    <!-- 二、零售商明细（多条） -->
    <div class="psec"><h4>二、零售商明细</h4>
      <span class="psec-r"><b id="pnRetCnt">0</b> 条</span>
    </div>
    <table class="bt" style="table-layout:fixed">
      <thead><tr>
        <th style="width:4%">#</th>
        <th style="width:19%">微信商户号</th>
        <th style="width:8%">区域</th>
        <th style="width:40%">商户名称</th>
        <th style="width:13%">SG零售商</th>
        <th style="width:9%">操作</th>
      </tr></thead>
      <tbody id="pnRetBody"><tr><td colspan="6" class="empty-row">尚未导入零售商</td></tr></tbody>
    </table>
    <div class="imp-row" onclick="openImp('ret')"><span class="ic">⇪</span> 从零售商库导入<span class="hint">按零售商名称筛选，勾选商户添加</span></div>

    <!-- 三、商品明细（多条） -->
    <div class="psec"><h4>三、活动商品明细</h4>
      <span class="psec-r"><b id="pnSkuCnt">0</b> 条</span>
    </div>
    <table class="bt" style="table-layout:fixed">
      <thead><tr>
        <th style="width:5%">#</th>
        <th style="width:32%">商品 / 品类</th>
        <th style="width:18%">SKU 编码</th>
        <th style="width:13%">供货价</th>
        <th style="width:20%">参与量</th>
        <th style="width:12%">操作</th>
      </tr></thead>
      <tbody id="pnSkuBody"><tr><td colspan="6" class="empty-row">尚未导入商品，点下方「从商品库导入」添加</td></tr></tbody>
    </table>
    <div class="imp-row" onclick="openImp('sku')"><span class="ic">⇪</span> 从商品库导入<span class="hint">支持多选，可按品类筛选</span></div>

    <!-- 四、预算与优惠发放规则 -->
    <div class="psec"><h4>四、预算与优惠发放规则</h4></div>
    <div class="fg c2">
      <div class="fr"><label>计划预算（元）<em>*</em></label><input class="inp" id="pnBudget" value="0" oninput="pnSum()"><div class="mut" style="font-size:11.6px;margin-top:4px">独立填写，不随零售商明细变动</div></div>
      <div class="fr"><label>发放数量（张）<em>*</em></label><input class="inp" id="pnQty" value="0"></div>
      <div class="fr"><label>券面额（元）<em>*</em></label><input class="inp" id="pnFace" value="0"></div>
      <div class="fr"><label>使用门槛（元）<em>*</em></label><input class="inp" id="pnThr" value="0"></div>
      <div class="fr"><label>领取限制</label><input class="inp" id="pnLimit" value="每人限领 2 张"></div>
      <div class="fr"><label>券有效期</label><input class="inp" id="pnValid" value="随批次有效期"></div>
    </div>

  </div>
  <div class="dw-f">
    <div class="lft">零售商明细 <b id="pnFRet">0</b> 条 · 商品明细 <b id="pnFSku">0</b> 条 · 带 <span style="color:var(--red)">*</span> 为必填</div>
    <div class="rgt">
      <button class="btn btn-g" onclick="closeDrawer()">取消</button>
      <button class="btn btn-o" onclick="pnSave(true)">保存并继续创建</button>
      <button class="btn btn-p" onclick="pnSave(false)">保存</button>
    </div>
  </div>
</div>
