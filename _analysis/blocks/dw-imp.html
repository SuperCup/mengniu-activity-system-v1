<div class="drawer" id="dw-imp">
  <div class="dw-h">
    <h3 id="impTitle">导入零售商</h3>
    <span class="dw-x" onclick="closeDrawer()">×</span>
  </div>
  <div class="imp-f">
    <input id="impKw" placeholder="搜索名称" oninput="renderImp(this.value)">
    <select id="impGrp" onchange="renderImp(document.getElementById('impKw').value)"></select>
    <label class="selall"><input type="checkbox" id="impAll" onchange="impAllToggle(this.checked)">全选</label>
  </div>
  <div class="imp-l" id="impBody"></div>
  <div class="dw-f">
    <div class="lft">已选 <b id="impCnt">0</b> 项 · 已在计划中的不可重复导入</div>
    <div class="rgt">
      <button class="btn btn-g" onclick="closeDrawer()">取消</button>
      <button class="btn btn-p" onclick="impOk()">确认导入</button>
    </div>
  </div>
</div>
