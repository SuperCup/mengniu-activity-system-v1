<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钉钉扫码登录 · 蒙牛活动管理平台</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<style>
  body{
    min-height:100vh;margin:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,var(--brand-ll) 0%,var(--bg) 46%);
    padding:24px;
  }
  .login-top{
    position:fixed;top:0;left:0;right:0;height:var(--top);
    background:var(--brand);display:flex;align-items:center;
    padding:0 20px;gap:10px;color:#fff;
  }
  .login-top .mn-mark{background:rgba(255,255,255,.18)}
  .login-top .t{font-size:var(--fs-md);font-weight:700}
  .login-top .t small{display:block;font-size:10.5px;font-weight:400;color:rgba(255,255,255,.72)}
  .login-env{
    margin-left:10px;font-size:10.5px;color:rgba(255,255,255,.86);
    border:1px solid rgba(255,255,255,.34);border-radius:var(--r-sm);padding:1px 7px;
  }

  .card{
    width:392px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--sh-lg);
    padding:28px 28px 22px;
  }
  .card h1{font-size:var(--fs-lg);font-weight:700;color:var(--ink);margin:0 0 4px}
  .card .sub{font-size:var(--fs-sm);color:var(--ink-60);line-height:1.7;margin:0 0 18px}
  .qr-wrap{
    width:184px;height:184px;margin:0 auto 14px;
    border:1px solid var(--line);border-radius:var(--r);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;background:#fff;
  }
  .qr-wrap .pat{
    position:absolute;inset:10px;
    background:
      repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px),
      repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 12px);
    background-size:100% 6px,6px 100%;
    opacity:.9;
  }
  .qr-wrap .tag{
    position:relative;background:#fff;color:var(--brand);font-weight:700;
    font-size:var(--fs-sm);padding:6px 10px;border-radius:var(--r-sm);
    border:1px solid var(--brand-20);
  }
  .steps{font-size:11.8px;color:var(--ink-60);line-height:1.9;margin:0 0 16px;padding-left:0;list-style:none}
  .steps li{padding-left:16px;position:relative}
  .steps li::before{
    content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;
    background:var(--aux-green);
  }
  button{
    width:100%;height:40px;border:none;border-radius:var(--r-sm);
    background:var(--brand);color:#fff;font-family:inherit;font-size:var(--fs-base);
    font-weight:600;cursor:pointer;transition:background .16s;
  }
  button:hover{background:var(--brand-d)}
  .skip{margin:12px 0 0;text-align:center;font-size:11.8px}
  .skip a{color:var(--brand-d);text-decoration:none;border-bottom:1px dashed rgba(9,108,82,.4)}
  .skip a:hover{color:var(--brand)}

  .note{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);
    font-size:11.6px;color:var(--ink-40);line-height:1.8;
  }
  .note b{color:var(--ink-60)}
</style>
</head>
<body>

<div class="login-top">
  <span class="mn-mark">蒙牛</span>
  <span class="t">蒙牛活动管理平台<small>活动管理平台 · 一期总部端</small></span>
  <span class="login-env">营销数字化与能力体系</span>
</div>

<div class="card">
  <h1>钉钉扫码登录</h1>
  <p class="sub">身份认证走钉钉，菜单与数据权限仍在本系统「系统管理」中配置。</p>

  <div class="qr-wrap" aria-hidden="true">
    <span class="pat"></span>
    <span class="tag">钉钉</span>
  </div>

  <ul class="steps">
    <li>打开钉钉，扫一扫左侧二维码</li>
    <li>确认登录后自动跳转总部端工作台</li>
    <li>首次登录默认「业务运营」角色，由管理员调整</li>
  </ul>

  <button type="button" id="ok">模拟扫码成功，进入工作台</button>

  <p class="skip"><a href="index.html?nologin=1" id="skip">暂不登录，直接进入</a></p>
</div>

<script>
document.getElementById('ok').addEventListener('click', function(){
  sessionStorage.setItem('mn_ding_login', '1');
  location.href = 'index.html';
});
</script>


</body></html>
