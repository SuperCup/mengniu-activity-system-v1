function tplDrawerbrief(){
  return `<div class="drawer" id="dw-brief" style="width:960px">
  <div class="dw-h">
    <h3 id="briefDwTitle">明细</h3>
    <span class="dw-x" onclick="closeDrawer()">×</span>
  </div>
  <div class="dw-b">
    <div class="note b" id="briefDwTip" style="margin-top:0">明细字段与「名单导入」模板一致</div>

    <div id="briefImpBox" style="display:none">
      <div class="psec"><h4>粘贴导入</h4><span class="psec-r">首行可为表头，可省略</span></div>
      <textarea class="inp" id="briefImpText" rows="4" style="width:100%"></textarea>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <button class="btn btn-o btn-xs" type="button" onclick="briefImpApply()">解析并追加</button>
        <button class="btn btn-g btn-xs" type="button" onclick="briefImpToggle()">收起</button>
        <span class="mut" id="briefImpCnt" style="font-size:11.6px"></span>

      <button class="btn btn-o btn-xs" type="button" onclick="briefImpToggle()">粘贴导入</button>

      <button class="btn btn-g" type="button" onclick="closeDrawer()">取消</button>
      <button class="btn btn-p" type="button" onclick="briefItemDone()">完成</button>
